<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rivendos fjalëkalimin — Libri i Shërbimeve</title>
  <link rel="stylesheet" href="/style.css?v=forgot-password-20260816">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/env-config.js?v=forgot-password-20260816"></script>
  <style>
    .reset-standalone-page { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1rem; background: radial-gradient(circle at top right, #dbeafe 0, #f8fafc 42%, #eef2ff 100%); }
    .reset-standalone-card { width: min(100%, 430px); padding: 2.25rem; background: rgba(255,255,255,.97); border: 1px solid #e2e8f0; border-radius: 24px; box-shadow: 0 24px 70px rgba(15,23,42,.12); }
    .reset-brand { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 1rem; border-radius: 18px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; font-size: 1.7rem; }
    .reset-eyebrow { margin: 0 0 .4rem; color: #2563eb; font-size: .75rem; font-weight: 800; letter-spacing: .08em; text-align: center; text-transform: uppercase; }
    .reset-standalone-card h1 { margin: 0; color: #0f172a; font-size: 1.7rem; text-align: center; }
    .reset-subtitle { margin: .65rem 0 1.5rem; color: #64748b; line-height: 1.5; font-size: .9rem; text-align: center; }
    .reset-form { display: grid; gap: .6rem; }
    .reset-form[hidden] { display: none; }
    .reset-form label { margin-top: .35rem; color: #0f172a; font-size: .85rem; font-weight: 600; }
    .reset-form input { width: 100%; padding: .7rem .85rem; border: 1px solid #e2e8f0; border-radius: 10px; color: #0f172a; font: inherit; outline: none; }
    .reset-form input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
    .reset-submit { width: 100%; margin-top: .65rem; padding: .75rem 1rem; border: 0; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; font: inherit; font-weight: 700; }
    .reset-submit:hover { background: #1d4ed8; }
    .reset-submit:disabled { cursor: wait; opacity: .7; }
    .reset-feedback { min-height: 1.4rem; margin: 1rem 0 0; color: #dc2626; font-size: .84rem; line-height: 1.45; text-align: center; }
    .reset-feedback.success { color: #15803d; }
    .reset-back { display: block; margin: 1rem auto 0; border: 0; background: transparent; color: #2563eb; cursor: pointer; font: inherit; font-size: .84rem; font-weight: 700; }
    .reset-back:hover { text-decoration: underline; }
    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 3rem; }
    .password-toggle-standalone { position: absolute; top: 50%; right: .7rem; transform: translateY(-50%); border: 0; background: transparent; color: #64748b; cursor: pointer; }
    @media (max-width: 640px) { .reset-standalone-card { padding: 1.6rem; border-radius: 20px; } }
  </style>
</head>
<body>
  <main class="reset-standalone-page">
    <section class="reset-standalone-card" aria-labelledby="reset-title">
      <div class="reset-brand" aria-hidden="true">↻</div>
      <p class="reset-eyebrow">Rivendosje e sigurt</p>
      <h1 id="reset-title">Vendos fjalëkalim të ri</h1>
      <p class="reset-subtitle">Vendos fjalëkalimin e ri dhe konfirmoje për të mbrojtur llogarinë.</p>
      <form id="standalone-reset-form" class="reset-form" hidden>
        <label for="standalone-new-password">Fjalëkalimi i ri</label>
        <div class="password-wrap">
          <input id="standalone-new-password" type="password" minlength="6" autocomplete="new-password" placeholder="Të paktën 6 karaktere" required>
          <button class="password-toggle-standalone" type="button" data-target="standalone-new-password" aria-label="Shfaq fjalëkalimin">Shfaq</button>
        </div>
        <label for="standalone-confirm-password">Konfirmo fjalëkalimin</label>
        <div class="password-wrap">
          <input id="standalone-confirm-password" type="password" minlength="6" autocomplete="new-password" placeholder="Përsërite fjalëkalimin" required>
          <button class="password-toggle-standalone" type="button" data-target="standalone-confirm-password" aria-label="Shfaq fjalëkalimin">Shfaq</button>
        </div>
        <button class="reset-submit" id="standalone-reset-submit" type="submit">Ruaj</button>
      </form>
      <p class="reset-feedback" id="standalone-reset-feedback" role="alert"></p>
      <button class="reset-back" id="standalone-reset-back" type="button">Kthehu te Login</button>
    </section>
  </main>
  <script>
    (() => {
      const supabaseUrl = window.env?.SUPABASE_URL || '';
      const supabaseKey = window.env?.SUPABASE_ANON_KEY || '';
      const feedback = document.getElementById('standalone-reset-feedback');
      const form = document.getElementById('standalone-reset-form');
      const submit = document.getElementById('standalone-reset-submit');
      const back = document.getElementById('standalone-reset-back');
      const client = supabaseUrl && supabaseKey && window.supabase?.createClient
        ? window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true } })
        : null;

      const setFeedback = (message = '', success = false) => {
        feedback.textContent = message;
        feedback.className = `reset-feedback${success ? ' success' : ''}`;
      };

      const goToLogin = () => { window.location.assign('/?auth=login'); };
      back.addEventListener('click', goToLogin);
      document.querySelectorAll('.password-toggle-standalone').forEach(toggle => {
        toggle.addEventListener('click', () => {
          const input = document.getElementById(toggle.dataset.target);
          const visible = input.type === 'text';
          input.type = visible ? 'password' : 'text';
          toggle.textContent = visible ? 'Shfaq' : 'Fshih';
        });
      });

      const hasRecoveryLink = () => {
        const params = new URLSearchParams(window.location.search);
        const hash = window.location.hash;
        return (hash.includes('access_token=') && hash.includes('type=recovery')) || params.has('code');
      };

      const waitForRecoverySession = async () => {
        if (!client || !hasRecoveryLink()) return null;
        const { data } = await client.auth.getSession();
        if (data?.session) return data.session;
        return await new Promise(resolve => {
          let settled = false;
          const finish = session => { if (!settled) { settled = true; resolve(session || null); } };
          const { data: listener } = client.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || session) finish(session);
          });
          window.setTimeout(() => { listener?.subscription?.unsubscribe(); finish(null); }, 2500);
        });
      };

      (async () => {
        const session = await waitForRecoverySession();
        if (!session) {
          setFeedback('Kjo lidhje për rivendosjen e fjalëkalimit është e pavlefshme ose ka skaduar. Kërko një link të ri nga Login-i.');
          return;
        }
        form.hidden = false;
      })();

      form.addEventListener('submit', async event => {
        event.preventDefault();
        const newPassword = document.getElementById('standalone-new-password').value;
        const confirmPassword = document.getElementById('standalone-confirm-password').value;
        if (newPassword.length < 6) return setFeedback('Fjalëkalimi duhet të ketë të paktën 6 karaktere.');
        if (newPassword !== confirmPassword) return setFeedback('Fjalëkalimet nuk përputhen.');
        submit.disabled = true;
        submit.textContent = 'Po ruhet...';
        setFeedback('');
        const { error } = await client.auth.updateUser({ password: newPassword });
        if (error) {
          submit.disabled = false;
          submit.textContent = 'Ruaj';
          return setFeedback(error.message || 'Ndodhi një gabim. Provo përsëri.');
        }
        setFeedback('Fjalëkalimi u ndryshua me sukses!', true);
        window.setTimeout(async () => {
          await client.auth.signOut();
          goToLogin();
        }, 3000);
      });
    })();
  </script>
</body>
</html>
