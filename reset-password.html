<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5f8ff">
  <title>Rivendos fjalëkalimin — Libri i Shërbimeve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/env-config.js?v=forgot-password-20260816"></script>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0f172a; background: #f5f8ff; }
    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: #f5f8ff; }
    button, input { font: inherit; }
    .reset-page { min-height: 100vh; display: grid; place-items: center; padding: clamp(1rem, 4vw, 3rem); position: relative; overflow: hidden; background: radial-gradient(circle at 12% 8%, rgba(147,197,253,.28), transparent 32%), radial-gradient(circle at 88% 94%, rgba(191,219,254,.4), transparent 35%), linear-gradient(135deg, #f8fbff 0%, #f1f5ff 100%); }
    .reset-page::before { content: ""; position: absolute; width: 420px; height: 420px; right: -170px; top: -180px; border: 1px solid rgba(59,130,246,.12); border-radius: 50%; box-shadow: 0 0 0 46px rgba(59,130,246,.035), 0 0 0 92px rgba(59,130,246,.025); pointer-events: none; }
    .reset-card { width: min(100%, 456px); position: relative; padding: clamp(1.5rem, 5vw, 2.75rem); border: 1px solid rgba(226,232,240,.9); border-radius: 28px; background: rgba(255,255,255,.94); box-shadow: 0 24px 70px rgba(30,64,175,.12), 0 4px 14px rgba(15,23,42,.04); backdrop-filter: blur(14px); }
    .reset-header { text-align: center; }
    .reset-brand { width: 62px; height: 62px; display: grid; place-items: center; margin: 0 auto 1.25rem; border-radius: 20px; background: linear-gradient(145deg, #2563eb, #1d4ed8); box-shadow: 0 12px 24px rgba(37,99,235,.24); color: #fff; }
    .reset-brand svg { width: 28px; height: 28px; }
    .reset-eyebrow { margin: 0 0 .5rem; color: #2563eb; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .reset-card h1 { margin: 0; color: #0f172a; font-size: clamp(1.45rem, 5vw, 1.85rem); letter-spacing: -.035em; line-height: 1.2; }
    .reset-subtitle { max-width: 340px; margin: .75rem auto 2rem; color: #64748b; font-size: .9rem; line-height: 1.6; }
    .reset-form { display: grid; gap: .45rem; }
    .reset-form[hidden] { display: none; }
    .reset-form label { margin-top: .55rem; color: #334155; font-size: .78rem; font-weight: 700; }
    .password-wrap { position: relative; }
    .reset-form input { width: 100%; min-height: 48px; padding: .78rem 3.8rem .78rem .9rem; border: 1px solid #dbe3ef; border-radius: 12px; outline: none; background: #fbfdff; color: #0f172a; font-size: .9rem; transition: border-color .18s ease, box-shadow .18s ease, background .18s ease; }
    .reset-form input::placeholder { color: #94a3b8; }
    .reset-form input:hover { border-color: #bfcee3; }
    .reset-form input:focus { border-color: #2563eb; background: #fff; box-shadow: 0 0 0 4px rgba(37,99,235,.12); }
    .reset-form input.input-invalid { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239,68,68,.08); }
    .reset-form input.input-valid { border-color: #22c55e; box-shadow: 0 0 0 4px rgba(34,197,94,.08); }
    .password-toggle { position: absolute; right: .75rem; top: 50%; transform: translateY(-50%); padding: .3rem; border: 0; background: transparent; color: #64748b; cursor: pointer; font-size: .72rem; font-weight: 700; }
    .password-toggle:hover { color: #2563eb; }
    .field-feedback { min-height: 1.1rem; margin: .25rem 0 0; color: #dc2626; font-size: .76rem; line-height: 1.4; }
    .field-feedback.success { color: #15803d; }
    .reset-submit { width: 100%; min-height: 50px; margin-top: .9rem; border: 0; border-radius: 12px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; cursor: pointer; font-size: .9rem; font-weight: 800; box-shadow: 0 10px 20px rgba(37,99,235,.2); transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease; }
    .reset-submit:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 14px 25px rgba(37,99,235,.26); }
    .reset-submit:active:not(:disabled) { transform: translateY(0); }
    .reset-submit:disabled { cursor: not-allowed; opacity: .58; box-shadow: none; }
    .reset-feedback { min-height: 1.35rem; margin: 1rem 0 0; color: #dc2626; font-size: .8rem; line-height: 1.5; text-align: center; }
    .reset-feedback.success { color: #15803d; }
    .reset-back { display: block; margin: 1.1rem auto 0; padding: .25rem; border: 0; background: transparent; color: #2563eb; cursor: pointer; font-size: .8rem; font-weight: 700; }
    .reset-back:hover { text-decoration: underline; }
    .reset-security-note { display: flex; align-items: center; justify-content: center; gap: .4rem; margin: 1.5rem 0 0; color: #94a3b8; font-size: .7rem; text-align: center; }
    .reset-security-note svg { width: 14px; height: 14px; color: #22c55e; }
    @media (max-width: 520px) { .reset-page { align-items: start; padding: 1rem; padding-top: max(1rem, env(safe-area-inset-top)); padding-bottom: max(1rem, env(safe-area-inset-bottom)); } .reset-card { margin: auto 0; border-radius: 22px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="reset-page">
    <section class="reset-card" aria-labelledby="reset-title">
      <header class="reset-header">
        <div class="reset-brand" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 3v5l3 2"/><path d="M17 3h4v4"/></svg></div>
        <p class="reset-eyebrow">Rivendosje e sigurt</p>
        <h1 id="reset-title">Vendos fjalëkalim të ri</h1>
        <p class="reset-subtitle">Krijo një fjalëkalim të ri për të vazhduar përdorimin e sigurt të llogarisë.</p>
      </header>
      <form id="standalone-reset-form" class="reset-form" hidden novalidate>
        <label for="standalone-new-password">Fjalëkalimi i ri</label>
        <div class="password-wrap">
          <input id="standalone-new-password" type="password" minlength="6" autocomplete="new-password" placeholder="Të paktën 6 karaktere" required>
          <button class="password-toggle" type="button" data-target="standalone-new-password" aria-label="Shfaq fjalëkalimin">Shfaq</button>
        </div>
        <label for="standalone-confirm-password">Konfirmo fjalëkalimin</label>
        <div class="password-wrap">
          <input id="standalone-confirm-password" type="password" minlength="6" autocomplete="new-password" placeholder="Përsërite fjalëkalimin" required>
          <button class="password-toggle" type="button" data-target="standalone-confirm-password" aria-label="Shfaq fjalëkalimin">Shfaq</button>
        </div>
        <p class="field-feedback" id="password-match-feedback" aria-live="polite"></p>
        <button class="reset-submit" id="standalone-reset-submit" type="submit">Ruaj</button>
      </form>
      <p class="reset-feedback" id="standalone-reset-feedback" role="alert" aria-live="polite"></p>
      <button class="reset-back" id="standalone-reset-back" type="button">Kthehu te Login</button>
      <p class="reset-security-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 4 7v5c0 4.8 3.4 8 8 9 4.6-1 8-4.2 8-9V7l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg> Lidhja e rikuperimit është e mbrojtur</p>
    </section>
  </main>
  <script>
    (() => {
      const supabaseUrl = window.env?.SUPABASE_URL || '';
      const supabaseKey = window.env?.SUPABASE_ANON_KEY || '';
      const feedback = document.getElementById('standalone-reset-feedback');
      const matchFeedback = document.getElementById('password-match-feedback');
      const form = document.getElementById('standalone-reset-form');
      const submit = document.getElementById('standalone-reset-submit');
      const back = document.getElementById('standalone-reset-back');
      const newPasswordField = document.getElementById('standalone-new-password');
      const confirmPasswordField = document.getElementById('standalone-confirm-password');
      const client = supabaseUrl && supabaseKey && window.supabase?.createClient
        ? window.supabase.createClient(supabaseUrl, supabaseKey, { auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: true } })
        : null;
      let recoveryEmail = '';
      const cleanRecoveryUrl = () => {
        window.history.replaceState({}, document.title, `${window.location.origin}/reset-password`);
      };

      const setFeedback = (message = '', success = false) => {
        feedback.textContent = message;
        feedback.className = `reset-feedback${success ? ' success' : ''}`;
      };

      const goToLogin = () => { window.location.assign('/?auth=login'); };
      back.addEventListener('click', goToLogin);

      document.querySelectorAll('.password-toggle').forEach(toggle => {
        toggle.addEventListener('click', () => {
          const input = document.getElementById(toggle.dataset.target);
          const visible = input.type === 'text';
          input.type = visible ? 'password' : 'text';
          toggle.textContent = visible ? 'Shfaq' : 'Fshih';
          toggle.setAttribute('aria-label', visible ? 'Shfaq fjalëkalimin' : 'Fshih fjalëkalimin');
        });
      });

      const hasRecoveryLink = () => {
        const params = new URLSearchParams(window.location.search);
        const hash = window.location.hash;
        return (hash.includes('access_token=') && hash.includes('type=recovery')) || params.has('code');
      };

      const updatePasswordMatch = () => {
        const newValue = newPasswordField.value;
        const confirmValue = confirmPasswordField.value;
        const hasBoth = newValue.length > 0 && confirmValue.length > 0;
        const matches = hasBoth && newValue === confirmValue;
        const mismatch = confirmValue.length > 0 && newValue !== confirmValue;
        confirmPasswordField.classList.toggle('input-invalid', mismatch);
        confirmPasswordField.classList.toggle('input-valid', matches);
        if (mismatch) {
          matchFeedback.textContent = 'Fjalëkalimet nuk përputhen.';
          matchFeedback.className = 'field-feedback';
        } else if (matches) {
          matchFeedback.textContent = 'Fjalëkalimet përputhen.';
          matchFeedback.className = 'field-feedback success';
        } else {
          matchFeedback.textContent = '';
          matchFeedback.className = 'field-feedback';
        }
        submit.disabled = mismatch || !hasBoth;
        return !mismatch;
      };
      newPasswordField.addEventListener('input', updatePasswordMatch);
      confirmPasswordField.addEventListener('input', updatePasswordMatch);

      const waitForRecoverySession = async () => {
        if (!client || !hasRecoveryLink()) return null;
        const { data } = await client.auth.getSession();
        if (data?.session) return data.session;
        return await new Promise(resolve => {
          let settled = false;
          const finish = session => { if (!settled) { settled = true; resolve(session || null); } };
          const { data: listener } = client.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || session) finish(session);
          });
          window.setTimeout(() => { listener?.subscription?.unsubscribe(); finish(null); }, 2500);
        });
      };

      (async () => {
        const session = await waitForRecoverySession();
        if (!session) {
          setFeedback('Kjo lidhje për rivendosjen e fjalëkalimit është e pavlefshme ose ka skaduar. Kërko një link të ri nga Login-i.');
          return;
        }
        recoveryEmail = session.user?.email || '';
        cleanRecoveryUrl();
        form.hidden = false;
        updatePasswordMatch();
      })();

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (!updatePasswordMatch()) return;
        const newPassword = newPasswordField.value;
        if (newPassword.length < 6) return setFeedback('Fjalëkalimi duhet të ketë të paktën 6 karaktere.');
        submit.disabled = true;
        submit.textContent = 'Po ruhet...';
        setFeedback('');
        const { error } = await client.auth.updateUser({ password: newPassword });
        if (error) {
          submit.disabled = false;
          submit.textContent = 'Ruaj';
          return setFeedback(error.message || 'Ndodhi një gabim. Provo përsëri.');
        }
        sessionStorage.setItem('libri-reset-success-message', 'Fjalëkalimi u ndryshua me sukses. Ju lutem identifikohuni me fjalëkalimin e ri.');
        if (recoveryEmail) sessionStorage.setItem('libri-reset-email', recoveryEmail);
        cleanRecoveryUrl();
        setFeedback('Fjalëkalimi u ndryshua me sukses!', true);
        window.setTimeout(async () => {
          await client.auth.signOut();
          goToLogin();
        }, 1200);
      });
    })();
  </script>
</body>
</html>
